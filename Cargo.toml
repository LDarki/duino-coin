[package]
name = "duco_server_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
bcrypt = "0.17"
sysinfo = { version = "0.37.2" }
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
rand = "0.8"
chrono = "0.4.42"
argon2 = "0.5.3"
